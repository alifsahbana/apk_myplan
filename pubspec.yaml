name: apk_myplant
description: "MyPlan - Personal Productivity Planner with gamification."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Icons
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  
  # State Management (keeping existing Provider)
  provider: ^6.1.2
  
  # Navigation
  go_router: ^14.6.2
  
  # Database (SQLite + Drift)
  drift: ^2.22.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.5
  path: ^1.9.0
  
  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  
  # Local Storage for preferences
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
  # Drift code generator
  drift_dev: ^2.22.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
